plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

// Release signing comes from keystore.properties (local, git-ignored) or, in
// CI, from environment variables decoded from repository secrets. Without
// either, the release build is simply left unsigned.
def keystoreProps = new Properties()
def keystoreFile = rootProject.file('keystore.properties')
if (keystoreFile.exists()) {
    keystoreFile.withInputStream { keystoreProps.load(it) }
}
def signingValue = { String propName, String envName ->
    keystoreProps.getProperty(propName) ?: System.getenv(envName)
}

int appVersionCode = (project.findProperty('versionCode') ?: '1').toString().toInteger()
String appVersionName = (project.findProperty('versionName') ?: '0.1-dev').toString()

android {
    namespace 'com.tembed.gpsbridge'
    compileSdk 34

    defaultConfig {
        applicationId "com.tembed.gpsbridge"
        minSdk 26
        targetSdk 34
        // CI passes the tag and the run number; local builds keep the defaults.
        versionCode appVersionCode
        versionName appVersionName
    }

    signingConfigs {
        release {
            def storePath = signingValue('storeFile', 'SIGNING_STORE_FILE')
            if (storePath) {
                storeFile rootProject.file(storePath)
                storePassword signingValue('storePassword', 'SIGNING_STORE_PASSWORD')
                keyAlias signingValue('keyAlias', 'SIGNING_KEY_ALIAS')
                keyPassword signingValue('keyPassword', 'SIGNING_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (signingValue('storeFile', 'SIGNING_STORE_FILE')) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    // Fused Location (Play Services / microG): used when available,
    // with a fallback to the plain LocationManager.GPS_PROVIDER of M0 when absent.
    implementation 'com.google.android.gms:play-services-location:21.3.0'
}
