plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.tembed.gpsbridge'
    compileSdk 34

    defaultConfig {
        applicationId "com.tembed.gpsbridge"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "0.1-M0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    // Fused Location (Play Services / microG): used when available,
    // with a fallback to the plain LocationManager.GPS_PROVIDER of M0 when absent.
    implementation 'com.google.android.gms:play-services-location:21.3.0'
}
