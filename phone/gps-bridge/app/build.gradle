plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.tembed.gpsbridge'
    compileSdk 34

    defaultConfig {
        applicationId "com.tembed.gpsbridge"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "0.1-M0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}

// Nessuna dipendenza esterna in M0: solo framework Android + stdlib Kotlin.
// android.useAndroidX=false in gradle.properties, di proposito.
dependencies {}
