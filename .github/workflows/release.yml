name: Release

# Push a tag such as v0.2.0 to publish a release containing the signed APK and
# the script to copy on the T-Embed's SD card.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Check the script on the Bruce interpreter
        run: |
          ./tools/js-harness/build.sh
          ./tools/js-harness/build/mqjs bruce/wardrive.js

      - name: Decode the signing key
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          test -n "$SIGNING_KEYSTORE_BASE64" || { echo "SIGNING_KEYSTORE_BASE64 secret is not set"; exit 1; }
          echo "$SIGNING_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Build the signed APK
        working-directory: phone/gps-bridge
        env:
          SIGNING_STORE_FILE: ${{ runner.temp }}/release.jks
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          ./gradlew assembleRelease -PversionName="$VERSION" -PversionCode="$GITHUB_RUN_NUMBER"

      - name: Collect the files
        run: |
          mkdir dist
          cp phone/gps-bridge/app/build/outputs/apk/release/app-release.apk "dist/gps-bridge-${GITHUB_REF_NAME}.apk"
          cp bruce/wardrive.js dist/wardrive.js
          cd dist && sha256sum * > SHA256SUMS

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
